name: Call Lifecycle Core
on:
  pull_request:
    paths:
      - 'packages/call-lifecycle/**'
      - '.github/workflows/call-lifecycle.yml'
  push:
    branches: ['feat/call-lifecycle-core', 'main']
    paths:
      - 'packages/call-lifecycle/**'
      - '.github/workflows/call-lifecycle.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/call-lifecycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Zero dependencies: no npm install, Electron binary or SIP account needed.
      - run: npm run test:coverage
      - run: npm run test:mutations
