name: SashaTel YC staging — approved Terraform apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "To approve paid staging VM + PostgreSQL 17, type DEPLOY-STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sashatel-staging-infra-state
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Apply four reviewed staging resources
    if: github.ref == 'refs/heads/feature/yc-staging-deployment-20261119' && inputs.confirmation == 'DEPLOY-STAGING'
    runs-on: ubuntu-latest
    environment: staging-infra
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: deploy/yc-infra/environments/staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      OIDC_AUDIENCE: https://github.com/suprunmvp-web
      YC_INFRA_SA_ID: aje639c2l6mhktjq4lpp
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_folder_id: b1gi9a6gkr55k6csn9s
      TF_VAR_existing_network_id: enpthm9vaqno3a8ogprk
      TF_VAR_existing_subnet_id: e9bm2hfyk1kfsoyimttp
      TF_VAR_vm_service_account_id: ajet0imh2qqqtr55h5im
      TF_VAR_zone: ru-central1-a
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_cidrs: '["${{ vars.SSH_ADMIN_CIDR }}"]'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Verify manual authorization and fixed target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          [[ "$TF_VAR_ssh_public_key" =~ ^ssh-(ed25519|rsa)\  ]]
          [[ "$TF_VAR_ssh_cidrs" =~ ^\[\"([0-9]{1,3}\.){3}[0-9]{1,3}/32\"\]$ ]]
          test "$TF_VAR_folder_id" = b1gi9a6gkr55k6csn9s
          echo "Authorized staging-only infrastructure. Creating resources incurs ongoing Yandex Cloud charges."
      - name: Exchange protected GitHub OIDC for short-lived YC IAM
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$OIDC_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          jwt="$(jq -er '.value' <<< "$response")"
          unset response
          JWT_PAYLOAD="$jwt" node -e '
            const p=JSON.parse(Buffer.from(process.env.JWT_PAYLOAD.split(".")[1],"base64url"));
            const expected="repo:suprunmvp-web@284134266/sashatel@1428882855:environment:staging-infra";
            if(p.sub!==expected || p.aud!==process.env.OIDC_AUDIENCE)process.exit(1);
            console.log("Staging OIDC audience and subject verified");
          '
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/yc-exchange.json" \
            --write-out '%{http_code}' \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_INFRA_SA_ID" \
            --data-urlencode "subject_token=$jwt" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          unset jwt
          if [[ "$code" != 200 ]]; then
            echo "YC exchange failed: HTTP $code" >&2
            exit 1
          fi
          token="$(jq -er '.access_token' "$RUNNER_TEMP/yc-exchange.json")"
          echo "::add-mask::$token"
          echo "YC_TOKEN=$token" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/yc-exchange.json"
          unset token
      - name: Build a fresh state-locked plan
        run: |
          set -euo pipefail
          terraform init -reconfigure -no-color
          terraform validate -no-color
          terraform plan -input=false -lock-timeout=3m -out="$RUNNER_TEMP/staging.tfplan" -no-color
      - name: Reject unexpected changes before apply
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json "$RUNNER_TEMP/staging.tfplan" > "$RUNNER_TEMP/staging.json"
          jq -e '
            [.resource_changes[]? |
              select(.change.actions != ["no-op"]) |
              {address, actions:.change.actions}] as $changes |
            ($changes | length) <= 4 and
            (all($changes[];
              (.actions == ["create"]) and
              (.address |
                IN(
                  "module.environment.yandex_compute_instance.api",
                  "module.environment.yandex_mdb_postgresql_cluster_v2.db",
                  "module.environment.yandex_vpc_security_group.api",
                  "module.environment.yandex_vpc_security_group.postgres"
                ))
            ))
          ' "$RUNNER_TEMP/staging.json" > /dev/null || {
            echo "Unexpected resource change: cancelled. No infrastructure applied." >&2
            exit 1
          }
          jq -r '[.resource_changes[]? | select(.change.actions != ["no-op"]) |
            [.address, (.change.actions | join("+"))]] |
            if length == 0 then "No infrastructure changes" else .[] | @tsv end' \
            "$RUNNER_TEMP/staging.json" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/staging.json"
      - name: Apply exactly the validated plan
        shell: bash
        run: |
          set -euo pipefail
          terraform apply -no-color -input=false -lock-timeout=3m "$RUNNER_TEMP/staging.tfplan"
          echo "Staging Terraform apply finished. This is infrastructure only; Backend API readiness is NOT confirmed." >> "$GITHUB_STEP_SUMMARY"
      - name: Record non-secret resource IDs
        if: success()
        run: |
          terraform output -no-color -json | jq -r '
            "VM: " + .api_vm_id.value,
            "PostgreSQL cluster: " + .postgres_cluster_id.value,
            "Private API IP: " + .api_private_ip.value
          ' >> "$GITHUB_STEP_SUMMARY"
