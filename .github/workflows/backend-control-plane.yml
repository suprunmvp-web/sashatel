name: Backend Control Plane
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-control-plane.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-admin
          POSTGRES_DB: control
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d control"
          --health-interval=5s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_ADMIN_URL: postgresql://postgres:disposable-ci-admin@127.0.0.1:5432/control
      DATABASE_URL: postgresql://control_runtime:disposable-ci-runtime@127.0.0.1:5432/control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare PostgreSQL
        run: |
          psql "$TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE control_runtime LOGIN PASSWORD 'disposable-ci-runtime' NOSUPERUSER NOBYPASSRLS"
          psql "$TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -1 -f migrations/001.sql -f migrations/runtime.sql -f migrations/002-uis.sql -f migrations/003-operator.sql -f migrations/004-web.sql -f migrations/005-trunk-routing.sql -f migrations/006-global-carousel.sql -f migrations/007-mail-lease.sql -f migrations/008-password-recovery.sql -f migrations/009-verified-inn-suggestions.sql -f migrations/010-internal-organization-reviews.sql -f migrations/011-auth-read-performance.sql -f migrations/012-internal-access.sql -f migrations/013-responsible-manager.sql -f migrations/014-internal-staff-permissions.sql -f migrations/015-verification-revocation.sql -f migrations/016-billing-ledger.sql -f migrations/017-client-billing.sql -f migrations/018-billing-overview.sql -f migrations/019-organization-staff.sql -f migrations/020-organization-staff-access.sql -f migrations/021-staff-invitations.sql -f migrations/022-invitation-mail.sql -f migrations/023-owner-invitations.sql
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Build release Docker image (no registry push or deploy)
        run: docker build --pull --file backend/Dockerfile --tag sashatel-backend:ci-${{ github.sha }} backend
        working-directory: .
      - name: Export tested backend image
        if: success()
        working-directory: .
        run: |
          docker save "sashatel-backend:ci-${{ github.sha }}" | gzip -1 > /tmp/sashatel-backend-${{ github.sha }}.tar.gz
          sha256sum /tmp/sashatel-backend-${{ github.sha }}.tar.gz > /tmp/sashatel-backend-${{ github.sha }}.tar.gz.sha256
      - name: Publish backend image as GitHub Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sashatel-backend-${{ github.sha }}
          path: |
            /tmp/sashatel-backend-${{ github.sha }}.tar.gz
            /tmp/sashatel-backend-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
