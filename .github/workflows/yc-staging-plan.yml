name: SashaTel staging — reviewed Terraform plan

on:
  push:
    branches:
      - feature/yc-staging-deployment-20261119
    paths:
      - '.github/workflows/yc-staging-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sashatel-staging-infra-state
  cancel-in-progress: false

jobs:
  plan:
    name: YC staging plan (no apply)
    runs-on: ubuntu-latest
    environment: staging-infra
    if: github.ref == 'refs/heads/feature/yc-staging-deployment-20261119'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: deploy/yc-infra/environments/staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      OIDC_AUDIENCE: https://github.com/suprunmvp-web
      YC_INFRA_SA_ID: aje639c2l6mhktjq4lpp
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_folder_id: b1gi9a6gkr55k6csn9s
      TF_VAR_existing_network_id: enpthm9vaqno3a8ogprk
      TF_VAR_existing_subnet_id: e9bm2hfyk1kfsoyimttp
      TF_VAR_vm_service_account_id: ajet0imh2qqqtr55h5im
      TF_VAR_zone: ru-central1-a
      TF_VAR_vm_image_id: ${{ vars.VM_IMAGE_ID }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_cidrs: '["${{ vars.SSH_ADMIN_CIDR }}"]'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Verify protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || {
            echo "Configure protected S3 state secrets" >&2; exit 1;
          }
          test -n "$TF_VAR_vm_image_id" && test -n "$TF_VAR_ssh_public_key" && test -n "$TF_VAR_ssh_cidrs" || {
            echo "Configure staging-infra vars: VM_IMAGE_ID, SSH_PUBLIC_KEY, SSH_ADMIN_CIDR" >&2
            exit 1
          }
          [[ "$TF_VAR_ssh_public_key" =~ ^ssh-(ed25519|rsa)\  ]] || { echo "Invalid SSH public key" >&2; exit 1; }
          [[ "$TF_VAR_ssh_cidrs" =~ ^\[[\"]([0-9]{1,3}\.){3}[0-9]{1,3}/32[\"]\]$ ]] || { echo "Only a single trusted administrator IPv4 /32 CIDR is supported" >&2; exit 1; }
      - name: Authenticate to Yandex Cloud (GitHub OIDC)
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$OIDC_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          jwt="$(jq -er '.value' <<< "$response")"
          unset response
          JWT_PAYLOAD="$jwt" node -e '
            const p=JSON.parse(Buffer.from(process.env.JWT_PAYLOAD.split(".")[1],"base64url"));
            const expected="repo:suprunmvp-web@284134266/sashatel@1428882855:environment:staging-infra";
            if(p.sub!==expected || p.aud!==process.env.OIDC_AUDIENCE)process.exit(1);
            console.log("Verified protected GitHub staging-infra identity");
          '
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/yc-exchange.json" \
            --write-out '%{http_code}' \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_INFRA_SA_ID" \
            --data-urlencode "subject_token=$jwt" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          unset jwt
          if [[ "$code" != 200 ]]; then
            jq -r '[.error // "",.error_description // ""]|join(" | ")' "$RUNNER_TEMP/yc-exchange.json" >&2
            exit 1
          fi
          token="$(jq -er '.access_token' "$RUNNER_TEMP/yc-exchange.json")"
          echo "::add-mask::$token"
          echo "YC_TOKEN=$token" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/yc-exchange.json"
          unset token
      - name: Terraform init, validate and refresh-only read
        shell: bash
        run: |
          set -euo pipefail
          terraform init -reconfigure -no-color
          terraform validate -no-color
          terraform plan -no-color -lock-timeout=3m -input=false -out="$RUNNER_TEMP/staging.tfplan"
      - name: Plan summary without exposing credentials
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json "$RUNNER_TEMP/staging.tfplan" |
            jq -r '
              [.resource_changes[]? |
                select(.change.actions | index("create") or index("update") or index("delete")) |
                [.address, (.change.actions|join("+"))]] |
              if length == 0 then "No infrastructure changes"
              else (["Resource", "Actions"] | @tsv), (.[] | @tsv) end
            ' >> "$GITHUB_STEP_SUMMARY"
          echo "Plan only. No changes applied. Owner must separately approve costs and apply." >> "$GITHUB_STEP_SUMMARY"
