# Example for DevOps, mount the immutable web/dist at /srv/sashatel.
# TLS, exact server_name and backend upstream are supplied by YC deployment.
server {
 listen 8080;
 root /srv/sashatel;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location /v1/ {
   proxy_pass http://sashatel_api;
   proxy_set_header Host $host;
   proxy_set_header Origin $http_origin;
   proxy_set_header Cookie $http_cookie;
   proxy_set_header X-CSRF-Token $http_x_csrf_token;
   proxy_set_header Idempotency-Key $http_idempotency_key;
   proxy_no_cache 1;
   proxy_cache_bypass 1;
 }
 location /assets/ { try_files $uri =404; }
 location = /version.json { add_header Cache-Control no-store; try_files $uri =404; }
 location / { add_header Cache-Control no-store; try_files $uri $uri/ /index.html; }
}
