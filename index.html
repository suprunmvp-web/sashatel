<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>SashaTel кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: чистый ч/б кабинет, сайдбар слева, светлая и тёмная тема; на телефоне сайдбар выезжает, таблицы становятся карточками */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F5F5F5; --line:#E5E5E5; --line-2:#F0F0F0;
  --fg:#0A0A0A; --fg-2:#404040; --muted:#737373; --faint:#A3A3A3;
  --accent:#0A0A0A; --accent-ink:#FFFFFF; --accent-soft:#F4F4F5; --accent-line:#D4D4D4; --accent-strong:#262626;
  --pos:#15803D; --pos-soft:#F0FDF4; --warn:#B45309; --warn-soft:#FFFBEB; --bad:#B91C1C; --bad-soft:#FEF2F2;
  --side:#FFFFFF; --side-2:#F4F4F5; --side-fg:#404040; --side-muted:#8A8A8A;
  --c1:#0A0A0A; --c2:#737373; --c3:#A3A3A3; --c4:#E5E5E5;
  --shadow:0 1px 2px rgba(0,0,0,.05); --pop:0 16px 48px rgba(0,0,0,.14);
  --f-sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-code:ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#141414; --surface-2:#1C1C1C; --line:#2A2A2A; --line-2:#202020;
  --fg:#FAFAFA; --fg-2:#D4D4D4; --muted:#A3A3A3; --faint:#6B6B6B;
  --accent:#FAFAFA; --accent-ink:#0A0A0A; --accent-soft:#232323; --accent-line:#3A3A3A; --accent-strong:#E5E5E5;
  --pos:#4ADE80; --pos-soft:#0F2417; --warn:#FBBF24; --warn-soft:#2A1F08; --bad:#F87171; --bad-soft:#2A1111;
  --side:#0F0F0F; --side-2:#1C1C1C; --side-fg:#D4D4D4; --side-muted:#7A7A7A;
  --c1:#FAFAFA; --c2:#A3A3A3; --c3:#6B6B6B; --c4:#2A2A2A;
  --shadow:0 1px 2px rgba(0,0,0,.4); --pop:0 16px 48px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#141414; --surface-2:#1C1C1C; --line:#2A2A2A; --line-2:#202020;
  --fg:#FAFAFA; --fg-2:#D4D4D4; --muted:#A3A3A3; --faint:#6B6B6B;
  --accent:#FAFAFA; --accent-ink:#0A0A0A; --accent-soft:#232323; --accent-line:#3A3A3A; --accent-strong:#E5E5E5;
  --pos:#4ADE80; --pos-soft:#0F2417; --warn:#FBBF24; --warn-soft:#2A1F08; --bad:#F87171; --bad-soft:#2A1111;
  --side:#0F0F0F; --side-2:#1C1C1C; --side-fg:#D4D4D4; --side-muted:#7A7A7A;
  --c1:#FAFAFA; --c2:#A3A3A3; --c3:#6B6B6B; --c4:#2A2A2A;
  --shadow:0 1px 2px rgba(0,0,0,.4); --pop:0 16px 48px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--f-mono)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.015em}
h2{font-size:15px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.sub{color:var(--muted);font-size:12px}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-weight:700;font-size:16px;color:var(--fg);letter-spacing:-.01em}
.logo{width:26px;height:26px;border-radius:8px;background:var(--fg);display:grid;place-items:center;color:var(--bg);font-size:13px;font-weight:700}
.co{position:relative;margin-bottom:8px}
.co-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:left}
.co-btn .n{display:block;font-weight:600;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-btn .s{display:block;font-size:12px;color:var(--side-muted)}
.co-btn>span:nth-child(2){flex:1;min-width:0}
.ava{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--bg);background:var(--fg);flex:none}
.grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--side-fg);cursor:pointer;text-align:left;font-size:14px;transition:background-color .15s,color .15s}
.nav svg{flex:none;opacity:.75}
.nav:hover{background:var(--side-2);color:var(--fg)}
.nav.on{background:var(--side-2);color:var(--fg);font-weight:600}.nav.on svg{opacity:1}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.setup{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:10px;background:var(--side-2);border:0;color:var(--fg);cursor:pointer;text-align:left}
.setup .ring{flex:none}
.setup b{display:block;font-size:13px}.setup span{font-size:12px;color:var(--side-muted)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;min-height:60px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.icon-btn.burger{display:none}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--fg);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.page{width:100%;max-width:1240px;padding-block:24px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.foot{margin-top:auto;padding-block:20px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}.foot a:hover{color:var(--fg)}

/* building blocks */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.ph .lead{color:var(--fg-2);max-width:70ch;margin-top:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h .muted{margin-top:2px}
.card-b{padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:0 10px}.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.icon{width:38px;padding:0}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;position:relative;color:var(--fg-2)}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--f-mono)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;font-family:var(--f-mono);background:var(--surface-2);color:var(--fg)}
.nav .badge{background:var(--bad);color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.tag.soon{background:none;border-style:dashed;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--pos-soft);color:var(--pos)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}.pill.info{background:var(--surface-2);color:var(--fg-2)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:14px 18px;border-right:1px solid var(--line-2);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500;display:block}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:-.02em;display:block;margin-top:2px;white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--fg)}.tab.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:32px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:13px}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line-2)}
.set:last-child{border-bottom:0}
.set .t{font-weight:500}
.set>div:first-child{min-width:0}
.sw{width:40px;height:24px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0;transition:background-color .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(16px)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper span{min-width:52px;text-align:center;font-family:var(--f-mono);font-weight:600}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--faint)}
.opt.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg);background:var(--surface)}
.opt p{color:var(--fg-2);font-size:13px;margin-top:3px}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);margin-top:1px}
.opt.on .radio{border:5px solid var(--accent)}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);margin-top:1px;display:grid;place-items:center;color:#fff;font-size:11px}
.opt.on .chk{background:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);cursor:pointer;font-size:13px}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--fg-2)}
.field input,.field select,.field textarea{min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font-size:15px;font-weight:400;width:100%}
.field textarea{padding:10px 12px;min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.help{font-size:12px;font-weight:400;color:var(--muted)}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.note.acc{background:var(--accent-soft);border-color:var(--accent-line)}
.note b{color:var(--fg)}
.empty{padding:32px 18px;text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:9px 16px;font-size:13px}
.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.code{margin:0;padding:14px 16px;border-radius:8px;background:#0A0A0A;color:#E5E5E5;border:1px solid var(--line);font-family:var(--f-code);font-size:12px;line-height:1.6;overflow-x:auto;white-space:pre}
.prog{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}.prog i{display:block;height:100%;background:var(--fg);border-radius:999px}
.bar{display:flex;align-items:center;gap:10px;min-width:120px}.bar .prog{flex:1}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:inherit}
.link:hover{text-decoration:underline}

/* tables: на телефоне строки превращаются в карточки */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 18px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tbody tr:hover{background:var(--surface-2)}
.t .r{text-align:right;font-family:var(--f-mono)}
.t td .sub{display:block}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-family:var(--f-mono);font-size:11px;fill:var(--faint)}
.grid-l{stroke:var(--line-2)}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:10px 12px;font-size:12px;pointer-events:none;min-width:190px;z-index:5;transition:left .12s ease}
.tip[hidden]{display:none}
.tip .h{font-weight:600;margin-bottom:6px}
.tip .r{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.tip .r i{width:8px;height:8px;border-radius:50%}
.tip .ev{margin-top:6px;padding-top:6px;border-top:1px solid var(--line-2);color:var(--fg-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--fg-2);cursor:pointer}
.lg i{width:12px;height:3px;border-radius:2px}
.lg.off{opacity:.45}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:fade .7s ease both}@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleY(0)}}

/* dozvon */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:center;padding:22px 24px}
.big{font-family:var(--f-mono);font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.goal{position:relative;height:12px;border-radius:999px;background:var(--line-2)}
.goal i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--fg);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.goal b{position:absolute;top:-6px;width:3px;height:24px;border-radius:2px;background:var(--fg)}
.factor{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.factor:last-child{border-bottom:0}
.fi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px}
.fi.bad{background:var(--bad-soft);color:var(--bad)}.fi.warn{background:var(--warn-soft);color:var(--warn)}.fi.info{background:var(--surface-2);color:var(--fg-2)}.fi.ok{background:var(--pos-soft);color:var(--pos)}
.factor .fact{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:4px}
.factor .fact b{font-family:var(--f-mono);font-size:15px}
.factor p{color:var(--fg-2);font-size:13px;margin-top:4px;max-width:70ch}
.delta{font-family:var(--f-mono);font-weight:600}.delta.up{color:var(--pos)}.delta.dn{color:var(--bad)}
.evn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;font-family:var(--f-mono)}
.verdict{display:flex;gap:16px;align-items:center;padding:18px;border-radius:12px;border:1px solid var(--line)}
.verdict.ok{background:var(--pos-soft);border-color:transparent}.verdict.bad{background:var(--warn-soft);border-color:transparent}
.verdict .big{font-size:36px}
.formula{font-family:var(--f-mono);font-size:13px;color:var(--fg-2);padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);overflow-x:auto;white-space:nowrap}
.mode-steps{display:flex;flex-direction:column;gap:0;margin-top:4px}
.mode-steps div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;font-size:13px;color:var(--fg-2)}
.mode-steps span{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.meter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meter div{padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.meter b{display:block;font-family:var(--f-mono);font-size:20px}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line-2)}
.stack i{display:block;height:100%}
.outl{display:flex;flex-direction:column;margin-top:12px}
.outl div{display:grid;grid-template-columns:10px minmax(0,1fr) auto 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.outl i{width:10px;height:10px;border-radius:3px}.outl b{text-align:right;font-family:var(--f-mono)}
.hours{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:170px;align-items:end}
.hr{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hr i{display:block;width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--c3)}
.hr.hi i{background:var(--accent)}.hr.lo i{background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 18px;font-size:13px;color:var(--fg-2)}
.live b{color:var(--fg);font-family:var(--f-mono)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--pos);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,128,92,.4)}70%{box-shadow:0 0 0 8px rgba(18,128,92,0)}100%{box-shadow:0 0 0 0 rgba(18,128,92,0)}}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.banner .prog{width:160px}
.steps{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.sp{flex:1 1 140px;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:0;border-right:1px solid var(--line-2);background:none;color:var(--muted);cursor:pointer;text-align:left;font-size:13px}
.sp:last-child{border-right:0}
.sp .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.sp.on{color:var(--fg);font-weight:600;background:var(--accent-soft)}.sp.on .n{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sp.done .n{background:var(--pos-soft);border-color:transparent;color:var(--pos)}
.crit{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto 38px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.crit.drag{opacity:.4}
.grip{cursor:grab;color:var(--faint);text-align:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:var(--surface-2)}
.timeline{display:flex;flex-direction:column;gap:14px;margin-top:10px;border-left:2px solid var(--line);padding-left:16px}
.timeline div{position:relative;display:flex;flex-direction:column}
.timeline div::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--faint);border:2px solid var(--surface)}
.timeline div.ok::before{background:var(--pos)}.timeline div.bad::before{background:var(--bad)}.timeline div.now::before{background:var(--accent)}
.checklist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.checklist div{display:flex;gap:8px;align-items:center}
.checklist div::before{content:"✓";width:20px;height:20px;border-radius:50%;background:var(--pos-soft);color:var(--pos);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.plan{padding:18px;display:flex;flex-direction:column;gap:12px}
.plan.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan .price b{font-family:var(--f-mono);font-size:26px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1}
.feat li{padding-left:22px;position:relative}.feat li::before{content:"✓";position:absolute;left:0;color:var(--pos);font-weight:700}
.feat li.no{color:var(--faint)}.feat li.no::before{content:"—";color:var(--faint)}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.brow:last-child{border-bottom:0}
.brow span:last-child{text-align:right;font-family:var(--f-mono)}
.total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding:18px;border-bottom:1px solid var(--line-2)}
.total b{font-family:var(--f-mono);font-size:28px}
.doc{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.doc:last-child{border-bottom:0}
.doc .ic{width:34px;height:34px;border-radius:8px;background:var(--surface-2);color:var(--fg);display:grid;place-items:center}
.phone{width:230px;margin:0 auto;border:1px solid var(--line);border-radius:30px;padding:28px 16px;text-align:center;background:var(--surface-2)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:70;border:0;padding:0;cursor:default;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:71;display:flex;flex-direction:column;box-shadow:var(--pop);animation:slide .22s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.drawer-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));background:var(--surface);border-radius:14px;box-shadow:var(--pop);z-index:72;padding:22px;display:flex;flex-direction:column;gap:12px}
.pop{position:absolute;z-index:65;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:6px;animation:pp .16s cubic-bezier(.2,.8,.2,1)}
@keyframes pp{from{opacity:0;transform:translateY(-4px)}}
.pop-i{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--fg);text-align:left;cursor:pointer;font-size:13px}
.pop-i:hover{background:var(--surface-2)}.pop-i.on{background:var(--accent-soft)}
.pop-i .sub{display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;box-shadow:var(--pop);max-width:calc(100vw - 32px);animation:pp .2s}
/* date picker */
.dp{right:0;top:46px;display:flex;max-width:calc(100vw - 24px);overflow-x:auto}
.dp-pre{display:flex;flex-direction:column;gap:2px;padding:6px;border-right:1px solid var(--line-2);min-width:140px}
.dp-pre button{min-height:36px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font-size:13px;color:var(--fg-2)}
.dp-pre button:hover{background:var(--surface-2)}.dp-pre button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dp-main{padding:12px 14px}
.cals{display:flex;gap:24px}
.cal{width:280px}
.cal-h{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;text-align:center;font-weight:600;margin-bottom:6px}
.cal-g{display:grid;grid-template-columns:repeat(7,40px);row-gap:3px}
.wd{height:26px;display:grid;place-items:center;font-size:11px;color:var(--faint);text-transform:uppercase}
.d{height:38px;border:0;background:none;font-family:var(--f-mono);font-size:13px;color:var(--fg);cursor:pointer;border-radius:10px}
.d:hover{background:var(--surface-2)}
.d.x{visibility:hidden;pointer-events:none}.d.dis{color:var(--faint);opacity:.5;pointer-events:none}
.d.in{background:var(--accent-soft);border-radius:0}
.d.s,.d.e{background:var(--fg);color:var(--bg);font-weight:600}
.d.s{border-radius:10px 0 0 10px}.d.e{border-radius:0 10px 10px 0}.d.s.e{border-radius:10px}
.dp-f{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.period{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}

/* responsive */
@media (max-width: 1100px){.kpis,.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis .kpi:nth-child(3n){border-right:0}.kpis .kpi:nth-child(-n+3){border-bottom:1px solid var(--line-2)}}
@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:80;transform:translateX(-100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);height:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:var(--pop)}
  .icon-btn.burger{display:inline-grid}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr);gap:18px}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page{padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width: 640px){
  h1{font-size:21px}
  .kpis,.kpis.k4,.kpis.k3,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
  .kpis .kpi:nth-child(2n){border-right:0}
  .kpi .v{font-size:19px}
  .card-h,.card-b,.set{padding-left:14px;padding-right:14px}
  .t thead{display:none}
  .t,.t tbody,.t tr,.t td{display:block;width:100%}
  .t tr{padding:12px 14px;border-bottom:1px solid var(--line-2)}
  .t tr:last-child{border-bottom:0}
  .t td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;border:0;text-align:right}
  .t td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left;flex:none;max-width:45%}
  .t td.p{display:block;text-align:left;padding-bottom:6px}
  .t td.p::before{content:none}
  .t td:empty{display:none}
  .t .r{text-align:right}
  .t td .bar{min-width:0;width:55%}
  .factor{grid-template-columns:30px minmax(0,1fr)}.factor>:last-child{grid-column:2}
  .dl{grid-template-columns:minmax(0,1fr)}.dl dt{margin-top:6px}
  .brow{grid-template-columns:minmax(0,1fr) auto}.brow span:nth-child(2){display:none}
  .outl div{grid-template-columns:10px minmax(0,1fr) 64px}.outl div span:nth-child(3){display:none}
  .hours{height:130px;gap:3px}.hr{font-size:10px}
  .meter{grid-template-columns:minmax(0,1fr)}
  .cals{flex-direction:column}.dp{flex-direction:column;right:-60px}.dp-pre{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line-2)}
  .crit{grid-template-columns:20px minmax(0,1fr) 38px}.crit .wt,.crit .cr{grid-column:2}
  .top .hide-m{display:none}
  .crumbs{display:none}
  .big{font-size:38px}
  .doc{padding:12px 14px}
}
/* v2: статистика */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px 18px}
.status .dotbig{width:12px;height:12px;border-radius:50%;flex:none}
.status.ok .dotbig{background:var(--pos);box-shadow:0 0 0 5px var(--pos-soft)}
.status.bad .dotbig{background:var(--warn);box-shadow:0 0 0 5px var(--warn-soft)}
.issue{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line-2);font-size:13px}
.kpi .dl2{display:block;font-family:var(--f-mono);font-size:12px;margin-top:2px}
.kpi .dl2.up{color:var(--pos)}.kpi .dl2.dn{color:var(--bad)}.kpi .dl2.nt{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filters select{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font-size:13px}
.heat{display:grid;gap:4px;font-size:13px}
.heat .hc{padding:10px;border-radius:8px;text-align:center;font-family:var(--f-mono);font-weight:600}
.heat .hh{padding:6px 10px;color:var(--muted);font-size:12px;text-align:center}
.heat .hr0{padding:10px 0;font-weight:500;display:flex;align-items:center}
.theme-btn svg{display:block}
.teaser{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
@media (max-width: 640px){.heat{font-size:12px}.heat .hc{padding:8px 4px}.heat .hr0{font-size:12px}}

/* v4: спокойнее и дороже */
body{font-feature-settings:"tnum","cv11";letter-spacing:-.003em}
h1{font-size:26px;letter-spacing:-.025em}
.pill.ok,.pill.neu,.pill.info{background:none;border:0;padding:0;color:var(--fg-2);height:auto}
.pill.ok::before{background:var(--pos)}.pill.neu::before,.pill.info::before{background:var(--faint)}
.t td b{font-weight:500}
.t th{font-weight:500;letter-spacing:.01em}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.03em}
.heat .hc{font-weight:500}
.wave{flex:1;height:32px;display:flex;align-items:center;gap:2px;min-width:0}.wave i{flex:1;min-width:1px;background:var(--faint);border-radius:1px}
.lic{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:4px}
.lic .big{font-size:40px}
.t td b.mono{white-space:nowrap}

/* статус-блок v5 */
.status{gap:12px;padding:18px 20px}
.status .sic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--fg-2)}
.status.bad .sic{color:var(--warn)}.status.ok .sic{color:var(--pos)}
.status h2{font-size:15px;font-weight:600}
.issue{display:block;padding:0;border-top:1px solid var(--line-2)}
.iss-row{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px}
.iss-h{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 8px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;border-radius:8px;font:inherit}
.iss-h:hover{background:var(--surface-2)}
.iss-h .chev{color:var(--faint);transition:transform .2s ease;flex:none;display:grid}
.issue.open .chev{transform:rotate(90deg)}
.iss-t{display:flex;flex-direction:column;min-width:0}.iss-t b{font-weight:500}.iss-t .muted{font-size:13px}
.iss-why{padding:0 20px 14px 46px;color:var(--fg-2);font-size:13px;max-width:78ch}
.iss-act{flex:none}
.cred{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.cred dt{color:var(--muted);font-size:13px}.cred dd{margin:0;font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.iss-row{flex-wrap:wrap}.iss-h{flex-basis:100%}.iss-act{margin-left:38px;margin-bottom:8px}.iss-why{padding-left:20px}}

/* здоровье */
.hlt .card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-2)}
.hm{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px 18px;border:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:none;color:inherit;font:inherit;cursor:pointer;min-width:0;transition:background .15s ease}
.hm:hover{background:var(--surface-2)}
.hgrid .hm:nth-child(3n){border-right:0}.hgrid .hm:nth-last-child(-n+3){border-bottom:0}
.hm-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hm-l{font-size:13px;color:var(--muted)}
.hs{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.hs::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pos)}
.hs.warn{color:var(--warn)}.hs.warn::before{background:var(--warn)}.hs.bad{color:var(--bad)}.hs.bad::before{background:var(--bad)}
.hm-v{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;display:flex;align-items:baseline;gap:8px}
.hm-v em{font-style:normal;font-size:13px;font-weight:500;letter-spacing:0}
.hm.warn .hm-v em{color:var(--warn)}.hm.bad .hm-v em{color:var(--bad)}
.hm-u{font-size:12px;color:var(--muted)}
.hm-bar{position:relative;height:4px;border-radius:2px;background:var(--line-2);margin:8px 0 4px}
.hm-bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--fg-2)}
.hm.warn .hm-bar i{background:var(--warn)}.hm.bad .hm-bar i{background:var(--bad)}
.hm-bar b{position:absolute;top:-3px;width:2px;height:10px;background:var(--fg);border-radius:1px;transform:translateX(-1px)}
.hm-n{font-size:12px;color:var(--muted)}
@media (max-width:900px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hgrid .hm:nth-child(3n){border-right:1px solid var(--line-2)}.hgrid .hm:nth-child(2n){border-right:0}.hgrid .hm:nth-last-child(-n+3){border-bottom:1px solid var(--line-2)}.hgrid .hm:nth-last-child(-n+2){border-bottom:0}}
@media (max-width:400px){.hm{padding:14px 12px}.hm-v{font-size:22px}.hm-top{flex-direction:column;align-items:flex-start;gap:2px}}

.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line-2)}.sbar i{height:100%;min-width:2px}
.lgd{display:inline-flex;align-items:center;gap:10px}.lgd>i{width:10px;height:10px;border-radius:3px;flex:none}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.steps-v{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px}
.cmodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cmode{display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;font:inherit;cursor:pointer;transition:border-color .15s ease}
.cmode:hover{border-color:var(--fg-2)}.cmode.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.cmode .dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;color:var(--muted)}.cmode .dl span:nth-child(2n){color:var(--fg);text-align:right}
@media (max-width:760px){.cmodes{grid-template-columns:1fr}}
.issue.ob{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px}

function saveTrunk(){
  const p = P(), nm = (S.form.tkName || '').trim();
  if (S.tkEdit){ const t = p.trunks.find(x => x.id === S.tkEdit); if (nm) t.name = nm; S.drawer = null; S.tkEdit = null; return toast('Сохранено'); }
  const own = S.tkKind === 'own', n = p.trunks.length + 1;
  p.trunks.push({id:'n' + Date.now(), key:null, name: nm || (own ? 'Свой транк ' + n : (S.form.tkOp || 'МегаФон') + ' · ' + n), kind: own ? 'own' : 'st', op: own ? '—' : (S.form.tkOp || 'МегаФон'), host:S.form.tkHost || 'pbx.uiscom.ru:5060', login:S.form.tkLogin || '100', lines: own ? 30 : +(S.form.tkLines || 20), nums: own ? 0 : S.buyQty, contract:'на подписании', main:S.form.tkMain || '—'});
  const nt = p.trunks[p.trunks.length-1]; if (!own) p.reqs.unshift({tk:nt.id, type:'Подключение', d:'Договор и транк ' + nt.op + ' · ' + S.buyQty + ' номеров', st:['Договор на подписании','warn'], at:'сегодня'});
  S.drawer = null; ['tkName','tkHost','tkLogin','tkPass','tkMain'].forEach(k => { S.form[k] = ''; });
  toast(own ? 'Транк подключён' : 'Заявка отправлена');
}
/* степперы с префиксом: w:<id>, split:<id> */
function stepAction(a, v){
  if (a.startsWith('w:')){ const c = S.crit.find(x => x.id === +a.slice(2)); c.w = Math.max(0, Math.min(50, c.w + v*5)); return render(); }
  if (a.startsWith('split:')){ const id = a.slice(6), p = P(), C = ctx(), t = C.trunks.find(x => x.id === id), cur = p.split[id] != null ? p.split[id] : (t.key && C.TOT.N ? Math.round(C.TOT.dl[t.key]/C.TOT.N*100) : 0); p.split[id] = Math.max(0, Math.min(100, cur + v*5)); return render(); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el){ if (S.pop && !e.target.closest('.pop')){ S.pop = null; render(); } if (S.dp && !e.target.closest('.dp') && !e.target.closest('.period')){ S.dp = null; render(); } return; }
  e.preventDefault();
  const a = el.dataset.a, v = el.dataset.v;
  if (telScreen() && (['sw','cmode','prot','dist','retries','qz:thr','qz:min','qz:rest','region','sameop'].includes(a) || a.startsWith('split:')) && !S.dirty){ S.snap = telSnap(); S.dirty = true; }
  if (ACT[a]) ACT[a](v, el); else if (a.startsWith('w:') || a.startsWith('split:')) stepAction(a, +v);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (S.confirm) S.confirm = null; else if (S.drawer) S.drawer = null; else if (S.dp) S.dp = null; else if (S.pop) S.pop = null; else if (S.sideOpen) S.sideOpen = false; else return; render(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.f; if (!f) return; S.form[f] = e.target.value; if (f === 'cq' || f === 'sq') return render(); if (f === 'lblText' || f === 'lblCat'){ const ph = document.querySelector('.phone b'); if (ph && f === 'lblText') ph.textContent = e.target.value || ''; } });
document.addEventListener('change', e => { const f = e.target.dataset && e.target.dataset.f; if (f){ S.form[f] = e.target.value; if (f === 'ft'){ S.ft = e.target.value; kickAnim(); return render(); } if (f === 'dim'){ S.dim = e.target.value; return render(); } if (f === 'rseg'){ S.rseg = e.target.value; return render(); } if (f === 'cT' || f === 'cR') return render(); if (f === 'qtext'){ const q = Object.keys(QS).find(k => e.target.value.toLowerCase().includes(k.split(' ')[0])); S.q = q || null; render(); } } });
document.addEventListener('mouseover', e => { const d = e.target.closest('[data-hv]'); if (!d || !S.dp || S.dp.b != null) return; const i = +d.dataset.hv; if (S.dp.hv !== i){ S.dp.hv = i; const lo = Math.min(S.dp.a, i), hi = Math.max(S.dp.a, i); document.querySelectorAll('.dp [data-hv]').forEach(x => { const j = +x.dataset.hv; x.classList.toggle('in', j >= lo && j <= hi); x.classList.toggle('s', j === lo); x.classList.toggle('e', j === hi); }); } });

document.addEventListener('drop', e => { const d = e.target.closest('[data-drag]'); if (!d || S.dragId == null) return; e.preventDefault(); const from = S.crit.findIndex(x => x.id === S.dragId), to = S.crit.findIndex(x => x.id === +d.dataset.drag); if (from >= 0 && to >= 0 && from !== to){ const [m] = S.crit.splice(from, 1); S.crit.splice(to, 0, m); } S.dragId = null; render(); });
